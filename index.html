<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Keychain Hong Kong &amp; MetroGoods Product Reference Lookup</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      font-family: "Inter", sans-serif;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }

    #barcodeReader video {
      border-radius: 0;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <header class="bg-white border-b border-slate-200 py-5">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 text-center">
      <h1 class="text-lg sm:text-xl font-semibold text-slate-900">
        Keychain Hong Kong &amp; MetroGoods Product Reference Lookup
      </h1>
    </div>
  </header>

  <main class="flex-grow max-w-3xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12">

    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">

      <form id="lookupForm" class="max-w-lg mx-auto" novalidate>
        <div class="flex flex-col sm:flex-row gap-3">
          <input
            type="text"
            id="productCodeInput"
            name="productCode"
            maxlength="13"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="EAN-13 or product code"
            aria-label="13-digit EAN barcode or 8-character product code"
            class="min-w-0 flex-grow w-full px-4 py-3.5 font-mono text-base uppercase bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all"
          >

          <button
            type="submit"
            class="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 shrink-0"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              />
            </svg>
            View Image
          </button>
        </div>

        <div
          id="validationError"
          role="alert"
          class="hidden mt-3 text-sm text-rose-600 bg-rose-50 border border-rose-200 px-3.5 py-2.5 rounded-xl"
        ></div>
      </form>

      <div class="max-w-lg mx-auto mt-3">
        <button
          type="button"
          id="scanBarcodeBtn"
          aria-controls="scannerPanel"
          aria-expanded="false"
          class="w-full px-5 py-3 bg-white hover:bg-indigo-50 border border-indigo-200 text-indigo-700 font-medium rounded-xl transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 8V4h4m8 0h4v4M4 16v4h4m8 0h4v-4M8 8v8m4-8v8m4-8v8"
            />
          </svg>
          Scan Barcode
        </button>

        <div
          id="scannerPanel"
          class="hidden mt-4 overflow-hidden rounded-xl border border-slate-200 bg-slate-50"
          role="region"
          aria-labelledby="scannerTitle"
        >
          <div class="flex items-center justify-between gap-3 px-4 py-3">
            <h2
              id="scannerTitle"
              class="font-semibold text-sm text-slate-900"
            >
              Scan EAN-13 Barcode
            </h2>

            <button
              type="button"
              id="stopScanBtn"
              class="px-3 py-1.5 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-100"
            >
              Cancel
            </button>
          </div>

          <div id="barcodeReader" class="w-full bg-black"></div>

          <p
            id="scannerStatus"
            role="status"
            class="px-4 py-3 text-sm text-slate-600 text-center"
          >
            Hold the barcode steady inside the camera view.
          </p>
        </div>
      </div>
    </section>

    <section
      id="resultContainer"
      class="mt-6 hidden"
      aria-live="polite"
    >
      <div
        id="loadingState"
        class="hidden bg-white rounded-2xl border border-slate-200 p-12 text-center shadow-sm animate-fade-in"
      >
        <div class="inline-block w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-3"></div>

        <p
          id="loadingMessage"
          class="text-sm font-medium text-slate-600"
        >
          Searching...
        </p>
      </div>

      <div
        id="successCard"
        class="hidden bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm animate-fade-in"
      >
        <div class="px-5 py-4 bg-slate-50 border-b border-slate-200">
          <div class="flex items-center justify-between gap-3 mb-4">
            <span class="px-2.5 py-1 rounded-md text-xs font-mono font-semibold bg-emerald-100 text-emerald-800">
              FOUND
            </span>

            <div class="flex items-center gap-2">
              <a
                id="openNewTabBtn"
                target="_blank"
                rel="noopener noreferrer"
                class="hidden px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50"
              >
                Open
              </a>

              <a
                id="downloadBtn"
                download
                class="hidden px-3 py-1.5 text-xs font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700"
              >
                Download
              </a>
            </div>
          </div>

          <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4 text-sm">
            <div>
              <dt class="text-xs font-medium text-slate-500 mb-1">
                EAN13
              </dt>
              <dd
                id="displayEAN13"
                class="font-mono text-slate-900 break-all"
              ></dd>
            </div>

            <div>
              <dt class="text-xs font-medium text-slate-500 mb-1">
                ProductCode
              </dt>
              <dd
                id="displayCode"
                class="font-mono font-semibold text-slate-900 break-all"
              ></dd>
            </div>

            <div class="sm:col-span-2">
              <dt class="text-xs font-medium text-slate-500 mb-1">
                ProductNameC
              </dt>
              <dd
                id="displayProductNameC"
                class="font-semibold text-slate-900 break-words"
              ></dd>
            </div>

            <div class="sm:col-span-2">
              <dt class="text-xs font-medium text-slate-500 mb-1">
                ProductCodeLong
              </dt>
              <dd
                id="displayProductCodeLong"
                class="font-mono text-slate-900 break-all"
              ></dd>
            </div>
          </dl>
        </div>

        <div class="p-4 sm:p-8 bg-slate-100/50 flex flex-col items-center justify-center min-h-[280px]">
          <p
            id="productImageStatus"
            role="status"
            class="mb-3 text-sm text-slate-500 text-center"
          ></p>

          <img
            id="referenceImage"
            alt="Product Reference Image"
            class="hidden max-h-[480px] w-auto max-w-full rounded-xl shadow-sm border border-slate-200 bg-white object-contain"
          >
        </div>
      </div>

      <div
        id="notFoundCard"
        class="hidden bg-white rounded-2xl border border-slate-200 p-8 sm:p-10 text-center shadow-sm animate-fade-in"
      >
        <h2
          id="notFoundMessage"
          class="text-base sm:text-lg font-semibold text-slate-900"
        ></h2>
      </div>
    </section>
  </main>

  <footer class="bg-white border-t border-slate-200 py-5">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 text-center text-xs text-slate-500">
      For internal use only. For enquiry, please contact (852) 95399243. V2611171604
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const CSV_URL = "./products.csv";
      const IMAGE_FOLDER = "./img/";

      const PRODUCT_CODE_PATTERN = /^[A-Z0-9]{8}$/;
      const EAN13_PATTERN = /^[0-9]{13}$/;

      const form = document.getElementById("lookupForm");
      const input = document.getElementById("productCodeInput");
      const validationError = document.getElementById("validationError");

      const resultContainer = document.getElementById("resultContainer");
      const loadingState = document.getElementById("loadingState");
      const loadingMessage = document.getElementById("loadingMessage");
      const successCard = document.getElementById("successCard");
      const notFoundCard = document.getElementById("notFoundCard");
      const notFoundMessage = document.getElementById("notFoundMessage");

      const referenceImage = document.getElementById("referenceImage");
      const imageStatus = document.getElementById("productImageStatus");
      const displayEAN13 = document.getElementById("displayEAN13");
      const displayCode = document.getElementById("displayCode");
      const displayProductNameC =
        document.getElementById("displayProductNameC");
      const displayProductCodeLong =
        document.getElementById("displayProductCodeLong");

      const openNewTabBtn = document.getElementById("openNewTabBtn");
      const downloadBtn = document.getElementById("downloadBtn");

      const scanBarcodeBtn = document.getElementById("scanBarcodeBtn");
      const stopScanBtn = document.getElementById("stopScanBtn");
      const scannerPanel = document.getElementById("scannerPanel");
      const scannerStatus = document.getElementById("scannerStatus");
      const readerElement = document.getElementById("barcodeReader");

      let mappingPromise = null;
      let latestLookupId = 0;
      let cameraSession = null;

      // Input and result display

      input.addEventListener("input", () => {
        input.value = input.value.replace(/\s+/g, "").toUpperCase();

        hideValidationError();
        latestLookupId++;
        resultContainer.classList.add("hidden");

        if (cameraSession) {
          void closeScanner(cameraSession);
        }
      });

      function showValidationError(message) {
        validationError.textContent = message;
        validationError.classList.remove("hidden");

        input.setAttribute("aria-invalid", "true");
        input.setAttribute("aria-describedby", "validationError");
      }

      function hideValidationError() {
        validationError.classList.add("hidden");

        input.removeAttribute("aria-invalid");
        input.removeAttribute("aria-describedby");
      }

      function setResultView(view) {
        resultContainer.classList.remove("hidden");

        loadingState.classList.toggle("hidden", view !== "loading");
        successCard.classList.toggle("hidden", view !== "success");
        notFoundCard.classList.toggle("hidden", view !== "notfound");
      }

      function showNotFound(message) {
        notFoundMessage.textContent = message;
        setResultView("notfound");
      }

      // CSV parser: handles quoted fields, commas and line breaks.

      function parseCSV(text) {
        const rows = [];
        let row = [];
        let field = "";
        let insideQuotes = false;

        text = text.replace(/^\uFEFF/, "");

        for (let i = 0; i < text.length; i++) {
          const character = text[i];

          if (character === '"') {
            if (insideQuotes && text[i + 1] === '"') {
              field += '"';
              i++;
            } else {
              insideQuotes = !insideQuotes;
            }
          } else if (character === "," && !insideQuotes) {
            row.push(field);
            field = "";
          } else if (
            (character === "\n" || character === "\r") &&
            !insideQuotes
          ) {
            row.push(field);
            rows.push(row);

            row = [];
            field = "";

            if (character === "\r" && text[i + 1] === "\n") {
              i++;
            }
          } else {
            field += character;
          }
        }

        if (insideQuotes) {
          throw new Error(
            "The CSV contains an unclosed quotation mark."
          );
        }

        if (field.length > 0 || row.length > 0) {
          row.push(field);
          rows.push(row);
        }

        return rows;
      }

      async function fetchProductDatabase() {
  const response = await fetch(CSV_URL, {
    cache: "no-store"
  });

  if (!response.ok) {
    throw new Error(
      "Could not load products.csv. Check that it is beside index.html."
    );
  }

  const rows = parseCSV(await response.text())
    .filter(row => row.some(cell => cell.trim() !== ""));

  if (rows.length === 0) {
    throw new Error("products.csv is empty.");
  }

  const requiredColumns = [
    "EAN13",
    "ProductCode",
    "ProductNameC",
    "ProductCodeLong"
  ];

  const headers = rows[0].map(cell =>
    cell.replace(/^\uFEFF/, "").trim().toLowerCase()
  );

  const columnIndexes = requiredColumns.map(name =>
    headers.indexOf(name.toLowerCase())
  );

  if (columnIndexes.some(index => index === -1)) {
    throw new Error(
      "The CSV header must include EAN13, ProductCode, " +
      "ProductNameC and ProductCodeLong."
    );
  }

  const byEAN13 = new Map();
  const byProductCode = new Map();

  // A null entry marks a conflicting duplicate.
  function addRecord(index, key, product) {
    if (!index.has(key)) {
      index.set(key, product);
      return;
    }

    const existing = index.get(key);

    if (
      existing === null ||
      requiredColumns.some(name => existing[name] !== product[name])
    ) {
      index.set(key, null);
      console.warn("Conflicting CSV records for:", key);
    }
  }

  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];

    const product = {
      EAN13: (row[columnIndexes[0]] || "").trim(),
      ProductCode: (row[columnIndexes[1]] || "")
        .trim()
        .toUpperCase(),
      ProductNameC: (row[columnIndexes[2]] || "").trim(),
      ProductCodeLong: (row[columnIndexes[3]] || "").trim()
    };

    const validProductCode =
      PRODUCT_CODE_PATTERN.test(product.ProductCode);

    const validEAN13 =
      EAN13_PATTERN.test(product.EAN13);

    if (!validProductCode) {
      console.warn(
        `Skipping CSV record ${i + 1}: invalid ProductCode`,
        product.ProductCode
      );
      continue;
    }

    // Product-code searches work even if EAN13 is blank or invalid.
    addRecord(byProductCode, product.ProductCode, product);

    // Only valid 13-digit barcodes are added to the barcode index.
    if (validEAN13) {
      addRecord(byEAN13, product.EAN13, product);
    } else {
      console.warn(
        `CSV record ${i + 1}: EAN13 is blank or invalid`,
        product.EAN13
      );
    }
  }

  if (byProductCode.size === 0) {
    throw new Error(
      "No valid 8-character product codes were found in products.csv."
    );
  }

  return { byEAN13, byProductCode };
}
	  


      function getProductDatabase() {
        if (!mappingPromise) {
          mappingPromise = fetchProductDatabase().catch(error => {
            mappingPromise = null;
            throw error;
          });
        }

        return mappingPromise;
      }

      // Product details and image

      function displayProduct(product, lookupId) {
        if (lookupId !== latestLookupId) return;

        const productCode = product.ProductCode;
        const imagePath = `${IMAGE_FOLDER}${productCode}.png`;

        displayEAN13.textContent = product.EAN13;
        displayCode.textContent = productCode;
        displayProductNameC.textContent =
          product.ProductNameC || "—";
        displayProductCodeLong.textContent =
          product.ProductCodeLong || "—";

        referenceImage.classList.add("hidden");
        referenceImage.removeAttribute("src");

        openNewTabBtn.classList.add("hidden");
        downloadBtn.classList.add("hidden");

        openNewTabBtn.removeAttribute("href");
        downloadBtn.removeAttribute("href");

        imageStatus.textContent = "Loading image...";
        imageStatus.classList.remove("hidden");

        // Display details immediately while the image loads.
        setResultView("success");

        const imageLoader = new Image();

        imageLoader.onload = () => {
          if (lookupId !== latestLookupId) return;

          referenceImage.src = imagePath;
          referenceImage.alt =
            product.ProductNameC ||
            `Reference image for product ${productCode}`;

          referenceImage.classList.remove("hidden");
          imageStatus.classList.add("hidden");

          openNewTabBtn.href = imagePath;
          downloadBtn.href = imagePath;

          downloadBtn.setAttribute(
            "download",
            `${productCode}.png`
          );

          openNewTabBtn.classList.remove("hidden");
          downloadBtn.classList.remove("hidden");
        };

        imageLoader.onerror = () => {
          if (lookupId !== latestLookupId) return;

          // Keep product details visible if the image is missing.
          imageStatus.textContent =
            `Image not found for product code ${productCode}.`;
        };

        imageLoader.src = imagePath;
      }

      async function lookupProduct(rawValue) {
        const lookupId = ++latestLookupId;
        const value = rawValue.trim().toUpperCase();

        hideValidationError();
        resultContainer.classList.add("hidden");

        if (!value) {
          showValidationError(
            "Please enter an EAN-13 barcode or an 8-character product code."
          );
          return;
        }

        const isBarcode = EAN13_PATTERN.test(value);
        const isProductCode = PRODUCT_CODE_PATTERN.test(value);

        if (!isBarcode && !isProductCode) {
          showValidationError(
            "Enter either 13 digits or an 8-character alphanumeric product code."
          );
          return;
        }

        loadingMessage.textContent = `Looking up ${value}...`;
        setResultView("loading");

        try {
          const database = await getProductDatabase();

          if (lookupId !== latestLookupId) return;

          const index = isBarcode
  ? database.byEAN13
  : database.byProductCode;

const product = index.get(value);

if (index.has(value) && product === null) {
  showNotFound(
    `Conflicting CSV records found for ${value}. Please check the CSV.`
  );
  return;
}

          if (!product) {
            showNotFound(
              isBarcode
                ? `No product found for barcode ${value}.`
                : `No product found for product code ${value}.`
            );
            return;
          }

          displayProduct(product, lookupId);
        } catch (error) {
          if (lookupId !== latestLookupId) return;

          resultContainer.classList.add("hidden");

          showValidationError(
            error instanceof TypeError
              ? "Unable to load the product list. Check your connection and try again."
              : error.message
          );
        }
      }

      form.addEventListener("submit", event => {
        event.preventDefault();

        if (cameraSession) {
          void closeScanner(cameraSession);
        }

        void lookupProduct(input.value);
      });

      // Camera scanning

      function isValidEAN13(value) {
        if (!EAN13_PATTERN.test(value)) return false;

        let sum = 0;

        for (let i = 0; i < 12; i++) {
          sum += Number(value[i]) * (i % 2 === 0 ? 1 : 3);
        }

        return (10 - (sum % 10)) % 10 === Number(value[12]);
      }

      function cameraErrorMessage(error) {
        const detail =
          `${error?.name || ""} ${error?.message || error}`;

        if (
          /NotAllowed|PermissionDenied|permission denied/i.test(detail)
        ) {
          return "Camera permission was denied. Allow camera access in your browser settings, then try again.";
        }

        if (/NotFound|DevicesNotFound/i.test(detail)) {
          return "No camera was found. Connect a camera or enter the code manually.";
        }

        if (
          /NotReadable|TrackStart|Could not start video/i.test(detail)
        ) {
          return "The camera could not start. Close other apps using it, then try again.";
        }

        return "Unable to open the camera. Check camera permission or enter the code manually.";
      }

      function stopRemainingVideoTracks() {
        readerElement.querySelectorAll("video").forEach(video => {
          const stream = video.srcObject;

          if (stream && typeof stream.getTracks === "function") {
            stream.getTracks().forEach(track => track.stop());
          }

          video.srcObject = null;
        });
      }

      async function closeScanner(session) {
        if (!session) return;

        session.cancelled = true;

        if (session.closePromise) {
          return session.closePromise;
        }

        if (cameraSession === session) {
          scannerPanel.classList.add("hidden");
          scanBarcodeBtn.setAttribute("aria-expanded", "false");
        }

        session.closePromise = (async () => {
          // Allow an outstanding camera startup to settle before cleanup.
          try {
            await session.startPromise;
          } catch {
            // Startup may have failed or permission was denied.
          }

          try {
            if (session.scanner.isScanning) {
              await session.scanner.stop();
            }
          } catch (error) {
            console.warn("Camera cleanup:", error);
          } finally {
            if (cameraSession === session) {
              stopRemainingVideoTracks();

              try {
                session.scanner.clear();
              } catch {
                // Reader may already be cleared.
              }

              readerElement.replaceChildren();
              cameraSession = null;
              scanBarcodeBtn.disabled = false;
            }
          }
        })();

        return session.closePromise;
      }

      function acceptScannedBarcode(session, decodedText) {
        if (
          cameraSession !== session ||
          session.cancelled ||
          session.accepted
        ) {
          return;
        }

        const barcode = decodedText.trim();

        if (!isValidEAN13(barcode)) return;

        session.accepted = true;

        input.value = barcode;
        hideValidationError();

        void closeScanner(session);
        void lookupProduct(barcode);
      }

      async function startScanner() {
        if (cameraSession) return;

        hideValidationError();

        if (!window.isSecureContext) {
          showValidationError(
            "Camera scanning requires HTTPS. Open your published GitHub Pages website."
          );
          return;
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          showValidationError(
            "This browser does not support camera access. Try Safari or Chrome, or enter the code manually."
          );
          return;
        }

        if (typeof Html5Qrcode === "undefined") {
          showValidationError(
            "The barcode scanner could not load. Check your internet connection and refresh the page."
          );
          return;
        }

        latestLookupId++;
        resultContainer.classList.add("hidden");

        input.blur();

        scanBarcodeBtn.disabled = true;
        scanBarcodeBtn.setAttribute("aria-expanded", "true");

        scannerPanel.classList.remove("hidden");
        scannerStatus.textContent =
          "Allow camera access when prompted.";

        let session;

        try {
          session = {
            scanner: new Html5Qrcode("barcodeReader", {
              formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13
              ],
              verbose: false
            }),
            cancelled: false,
            accepted: false,
            startPromise: null,
            closePromise: null
          };

          cameraSession = session;

          session.startPromise = session.scanner.start(
            { facingMode: "environment" },
            { fps: 10 },
            decodedText => {
              acceptScannedBarcode(session, decodedText);
            },
            () => {
              // Frames without a readable barcode are normal.
            }
          );

          await session.startPromise;

          if (!session.cancelled && !session.accepted) {
            scannerStatus.textContent =
              "Hold the complete barcode steady in view. Use good lighting and move slightly closer or farther away.";
          }
        } catch (error) {
          const wasCancelled = session?.cancelled;

          if (session) {
            await closeScanner(session);
          } else {
            scannerPanel.classList.add("hidden");
            scanBarcodeBtn.disabled = false;
            scanBarcodeBtn.setAttribute("aria-expanded", "false");
          }

          if (!wasCancelled) {
            showValidationError(cameraErrorMessage(error));
          }
        }
      }

      scanBarcodeBtn.addEventListener("click", () => {
        void startScanner();
      });

      stopScanBtn.addEventListener("click", () => {
        void closeScanner(cameraSession);
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && cameraSession) {
          void closeScanner(cameraSession);
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && cameraSession) {
          void closeScanner(cameraSession);
        }
      });

      window.addEventListener("pagehide", () => {
        stopRemainingVideoTracks();

        if (cameraSession) {
          void closeScanner(cameraSession);
        }
      });
    });
  </script>
</body>
</html>

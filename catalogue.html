<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Keychain Hong Kong &amp; MetroGoods Product Catalog</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      font-family: "Inter", sans-serif;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }

    /* Adaptive grid: strictly 3 columns on mobile, auto-filling columns on desktop */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    @media (min-width: 640px) {
      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 1.25rem;
      }
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 py-4 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div class="text-center sm:text-left">
        <h1 class="text-base sm:text-xl font-semibold text-slate-900">
          Keychain Hong Kong &amp; MetroGoods Product Catalog
        </h1>
        <p id="productCount" class="text-xs text-slate-500 mt-0.5">
          Loading catalog...
        </p>
      </div>

      <!-- Quick Filter & Navigation -->
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <div class="relative flex-grow sm:w-64">
          <input
            type="search"
            id="filterInput"
            placeholder="Filter code, name, or barcode..."
            aria-label="Filter products"
            class="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-300 rounded-xl text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
          >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>

        <a
          href="./index.html"
          class="px-3.5 py-2 text-xs sm:text-sm font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-xl shrink-0 transition"
        >
          Lookup / Scan
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow max-w-7xl w-full mx-auto px-3 sm:px-6 py-6 sm:py-8">

    <!-- Loading State -->
    <div
      id="loadingState"
      class="bg-white rounded-2xl border border-slate-200 p-12 text-center shadow-sm"
    >
      <div class="inline-block w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-3"></div>
      <p class="text-sm font-medium text-slate-600">Loading products from products.csv...</p>
    </div>

    <!-- Error State -->
    <div
      id="errorState"
      role="alert"
      class="hidden bg-rose-50 border border-rose-200 text-rose-700 rounded-2xl p-6 text-center text-sm"
    ></div>

    <!-- Empty Filter State -->
    <div
      id="emptyFilterState"
      class="hidden bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-500"
    >
      No products match your filter.
    </div>

    <!-- Product Grid -->
    <div id="productGrid" class="product-grid hidden"></div>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-5 mt-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 text-center text-xs text-slate-500">
      For internal use only. For enquiry, please contact (852) 95399243. V2611181519
    </div>
  </footer>

  <!-- Enlarged Image & Product Details Modal -->
  <div
    id="productModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalProductName"
    class="hidden fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-slate-900/75 backdrop-blur-xs animate-fade-in"
  >
    <div
      id="modalBackdrop"
      class="fixed inset-0"
      aria-hidden="true"
    ></div>

    <div class="relative z-10 bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-2xl max-h-[92vh] flex flex-col overflow-hidden">

      <!-- Modal Top Bar -->
      <div class="px-4 sm:px-6 py-3.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between gap-3 shrink-0">
        <span
          id="modalBadgeCode"
          class="px-2.5 py-1 rounded-md text-xs font-mono font-semibold bg-indigo-100 text-indigo-800"
        ></span>

        <div class="flex items-center gap-2">
          <a
            id="modalOpenNewTabBtn"
            target="_blank"
            rel="noopener noreferrer"
            class="hidden px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50"
          >
            Open
          </a>

          <a
            id="modalDownloadBtn"
            download
            class="hidden px-3 py-1.5 text-xs font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700"
          >
            Download
          </a>

          <button
            type="button"
            id="closeModalBtn"
            aria-label="Close product details"
            class="p-1.5 text-slate-500 hover:text-slate-800 hover:bg-slate-200/70 rounded-lg transition"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Modal Scrollable Body -->
      <div class="overflow-y-auto flex-grow">
        <!-- Enlarged PNG Section -->
        <div class="p-4 sm:p-6 bg-slate-100/70 border-b border-slate-200 flex flex-col items-center justify-center min-h-[240px]">
          <p
            id="modalImageStatus"
            class="text-sm text-slate-500 text-center"
          ></p>

          <img
            id="modalImage"
            alt="Enlarged Product Reference Image"
            class="hidden max-h-[50vh] w-auto max-w-full rounded-xl shadow-sm border border-slate-200 bg-white object-contain"
          >
        </div>

        <!-- Product Details Section -->
        <div class="p-4 sm:p-6">
          <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4 text-sm">
            <div>
              <dt class="text-xs font-medium text-slate-500 mb-1">
                EAN-13產品條碼
              </dt>
              <dd
                id="modalEAN13"
                class="font-mono text-slate-900 break-all"
              ></dd>
            </div>

            <div>
              <dt class="text-xs font-medium text-slate-500 mb-1">
                8位產品型號
              </dt>
              <dd
                id="modalCode"
                class="font-mono font-semibold text-slate-900 break-all"
              ></dd>
            </div>

            <div class="sm:col-span-2">
              <dt class="text-xs font-medium text-slate-500 mb-1">
                產品名稱
              </dt>
              <dd
                id="modalProductName"
                class="font-semibold text-slate-900 break-words"
              ></dd>
            </div>

            <div class="sm:col-span-2">
              <dt class="text-xs font-medium text-slate-500 mb-1">
                11位產品型號(個別零售點專用)
              </dt>
              <dd
                id="modalProductCodeLong"
                class="font-mono text-slate-900 break-all"
              ></dd>
            </div>
          </dl>

          <!-- Generated EAN-13 Barcode -->
          <div
            id="modalBarcodeContainer"
            class="hidden mt-6 pt-5 border-t border-slate-100 text-center"
          >
            <div class="inline-block max-w-full bg-white p-3 rounded-lg border border-slate-200 overflow-x-auto">
              <svg
                id="modalBarcode"
                role="img"
                aria-label="Product EAN-13 barcode"
                class="mx-auto"
              ></svg>
            </div>
          </div>

          <p
            id="modalBarcodeMessage"
            class="hidden mt-5 pt-4 border-t border-slate-100 text-xs text-slate-500 text-center"
          ></p>
        </div>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const CSV_URL = "./products.csv";
      const IMAGE_FOLDER = "./img/";
      const PRODUCT_CODE_PATTERN = /^[A-Z0-9]{8}$/;
      const EAN13_PATTERN = /^[0-9]{13}$/;

      const loadingState = document.getElementById("loadingState");
      const errorState = document.getElementById("errorState");
      const emptyFilterState = document.getElementById("emptyFilterState");
      const productGrid = document.getElementById("productGrid");
      const productCount = document.getElementById("productCount");
      const filterInput = document.getElementById("filterInput");

      // Modal elements
      const productModal = document.getElementById("productModal");
      const modalBackdrop = document.getElementById("modalBackdrop");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const modalBadgeCode = document.getElementById("modalBadgeCode");
      const modalOpenNewTabBtn = document.getElementById("modalOpenNewTabBtn");
      const modalDownloadBtn = document.getElementById("modalDownloadBtn");
      const modalImageStatus = document.getElementById("modalImageStatus");
      const modalImage = document.getElementById("modalImage");
      const modalEAN13 = document.getElementById("modalEAN13");
      const modalCode = document.getElementById("modalCode");
      const modalProductName = document.getElementById("modalProductName");
      const modalProductCodeLong = document.getElementById("modalProductCodeLong");
      const modalBarcodeContainer = document.getElementById("modalBarcodeContainer");
      const modalBarcode = document.getElementById("modalBarcode");
      const modalBarcodeMessage = document.getElementById("modalBarcodeMessage");

      let allProducts = [];
      let lastFocusedElement = null;

      // CSV parser (identical logic to index.html)
      function parseCSV(text) {
        const rows = [];
        let row = [];
        let field = "";
        let insideQuotes = false;

        text = text.replace(/^\uFEFF/, "");

        for (let i = 0; i < text.length; i++) {
          const character = text[i];

          if (character === '"') {
            if (insideQuotes && text[i + 1] === '"') {
              field += '"';
              i++;
            } else {
              insideQuotes = !insideQuotes;
            }
          } else if (character === "," && !insideQuotes) {
            row.push(field);
            field = "";
          } else if (
            (character === "\n" || character === "\r") &&
            !insideQuotes
          ) {
            row.push(field);
            rows.push(row);

            row = [];
            field = "";

            if (character === "\r" && text[i + 1] === "\n") {
              i++;
            }
          } else {
            field += character;
          }
        }

        if (insideQuotes) {
          throw new Error("The CSV contains an unclosed quotation mark.");
        }

        if (field.length > 0 || row.length > 0) {
          row.push(field);
          rows.push(row);
        }

        return rows;
      }

      async function loadProducts() {
        const response = await fetch(CSV_URL, { cache: "no-store" });

        if (!response.ok) {
          throw new Error("Could not load products.csv. Check that it is beside this HTML file.");
        }

        const rows = parseCSV(await response.text())
          .filter(row => row.some(cell => cell.trim() !== ""));

        if (rows.length === 0) {
          throw new Error("products.csv is empty.");
        }

        const requiredColumns = [
          "EAN13",
          "ProductCode",
          "ProductNameC",
          "ProductCodeLong"
        ];

        const headers = rows[0].map(cell =>
          cell.replace(/^\uFEFF/, "").trim().toLowerCase()
        );

        const columnIndexes = requiredColumns.map(name =>
          headers.indexOf(name.toLowerCase())
        );

        if (columnIndexes.some(index => index === -1)) {
          throw new Error(
            "The CSV header must include EAN13, ProductCode, ProductNameC and ProductCodeLong."
          );
        }

        const productMap = new Map();

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          const productCode = (row[columnIndexes[1]] || "").trim().toUpperCase();

          if (!PRODUCT_CODE_PATTERN.test(productCode)) {
            continue;
          }

          if (!productMap.has(productCode)) {
            productMap.set(productCode, {
              EAN13: (row[columnIndexes[0]] || "").trim(),
              ProductCode: productCode,
              ProductNameC: (row[columnIndexes[2]] || "").trim(),
              ProductCodeLong: (row[columnIndexes[3]] || "").trim()
            });
          }
        }

        // Sort strictly in alphabetical order of ProductCode (Column B)
        const sortedProducts = Array.from(productMap.values()).sort((a, b) =>
          a.ProductCode.localeCompare(b.ProductCode, "en", { sensitivity: "base" })
        );

        if (sortedProducts.length === 0) {
          throw new Error("No valid 8-character product codes were found in products.csv.");
        }

        return sortedProducts;
      }

      function isValidEAN13(value) {
        if (!EAN13_PATTERN.test(value)) return false;

        let sum = 0;
        for (let i = 0; i < 12; i++) {
          sum += Number(value[i]) * (i % 2 === 0 ? 1 : 3);
        }

        return (10 - (sum % 10)) % 10 === Number(value[12]);
      }

      function renderModalBarcode(rawEAN13) {
        const ean13 = String(rawEAN13 || "").trim();

        modalBarcodeContainer.classList.add("hidden");
        modalBarcodeMessage.classList.add("hidden");
        modalBarcode.replaceChildren();

        if (!ean13) {
          modalBarcodeMessage.textContent = "No EAN-13 barcode assigned.";
          modalBarcodeMessage.classList.remove("hidden");
          return;
        }

        if (!isValidEAN13(ean13)) {
          modalBarcodeMessage.textContent =
            "Cannot generate barcode: the EAN-13 number or check digit is invalid.";
          modalBarcodeMessage.classList.remove("hidden");
          return;
        }

        if (typeof JsBarcode === "undefined") {
          modalBarcodeMessage.textContent =
            "The barcode generator could not load. Please refresh the page.";
          modalBarcodeMessage.classList.remove("hidden");
          return;
        }

        try {
          JsBarcode(modalBarcode, ean13, {
            format: "EAN13",
            width: 2,
            height: 70,
            displayValue: true,
            fontSize: 16,
            textMargin: 6,
            margin: 12,
            background: "#ffffff",
            lineColor: "#000000"
          });

          modalBarcode.setAttribute("aria-label", `EAN-13 barcode ${ean13}`);
          modalBarcodeContainer.classList.remove("hidden");
        } catch {
          modalBarcode.replaceChildren();
          modalBarcodeMessage.textContent = "Unable to generate this product's barcode.";
          modalBarcodeMessage.classList.remove("hidden");
        }
      }

      function openProductModal(product) {
        lastFocusedElement = document.activeElement;

        const productCode = product.ProductCode;
        const imagePath = `${IMAGE_FOLDER}${productCode}.png`;

        modalBadgeCode.textContent = productCode;
        modalEAN13.textContent = product.EAN13 || "—";
        modalCode.textContent = productCode;
        modalProductName.textContent = product.ProductNameC || "—";
        modalProductCodeLong.textContent = product.ProductCodeLong || "—";

        renderModalBarcode(product.EAN13);

        modalImage.classList.add("hidden");
        modalImage.removeAttribute("src");
        modalOpenNewTabBtn.classList.add("hidden");
        modalDownloadBtn.classList.add("hidden");
        modalImageStatus.textContent = "Loading image...";
        modalImageStatus.classList.remove("hidden");

        productModal.classList.remove("hidden");
        document.body.classList.add("overflow-hidden");
        closeModalBtn.focus();

        const loader = new Image();
        loader.onload = () => {
          modalImage.src = imagePath;
          modalImage.alt = product.ProductNameC || `Reference image for ${productCode}`;
          modalImage.classList.remove("hidden");
          modalImageStatus.classList.add("hidden");

          modalOpenNewTabBtn.href = imagePath;
          modalDownloadBtn.href = imagePath;
          modalDownloadBtn.setAttribute("download", `${productCode}.png`);

          modalOpenNewTabBtn.classList.remove("hidden");
          modalDownloadBtn.classList.remove("hidden");
        };

        loader.onerror = () => {
          modalImageStatus.textContent = `Image not found for product code ${productCode}.`;
        };

        loader.src = imagePath;
      }

      function closeProductModal() {
        productModal.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");

        if (lastFocusedElement && typeof lastFocusedElement.focus === "function") {
          lastFocusedElement.focus();
        }
      }

      function createProductCard(product) {
        const button = document.createElement("button");
        button.type = "button";
        button.className =
          "group bg-white rounded-xl border border-slate-200 overflow-hidden shadow-xs hover:shadow-md hover:border-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition flex flex-col text-left";
        button.setAttribute(
          "aria-label",
          `View details for ${product.ProductCode} ${product.ProductNameC || ""}`
        );

        // Square image wrapper
        const imageWrapper = document.createElement("div");
        imageWrapper.className =
          "relative w-full aspect-square bg-slate-100/60 flex items-center justify-center p-2 sm:p-3 overflow-hidden";

        const img = document.createElement("img");
        img.src = `${IMAGE_FOLDER}${product.ProductCode}.png`;
        img.alt = product.ProductNameC || product.ProductCode;
        img.loading = "lazy";
        img.className =
          "max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-200";

        // Fallback badge if PNG file is missing
        img.onerror = () => {
          img.classList.add("hidden");
          const fallback = document.createElement("span");
          fallback.className = "text-[11px] font-mono text-slate-400 text-center px-1";
          fallback.textContent = "No PNG";
          imageWrapper.appendChild(fallback);
        };

        imageWrapper.appendChild(img);

        // Minimal label footer showing ProductCode (and ProductNameC on larger screens)
        const caption = document.createElement("div");
        caption.className = "px-2 py-2 sm:px-3 sm:py-2.5 border-t border-slate-100 bg-white w-full";

        const codeEl = document.createElement("div");
        codeEl.className =
          "font-mono text-xs sm:text-sm font-semibold text-slate-900 group-hover:text-indigo-600 truncate";
        codeEl.textContent = product.ProductCode;

        const nameEl = document.createElement("div");
        nameEl.className = "text-[11px] sm:text-xs text-slate-500 truncate mt-0.5";
        nameEl.textContent = product.ProductNameC || "—";

        caption.appendChild(codeEl);
        caption.appendChild(nameEl);

        button.appendChild(imageWrapper);
        button.appendChild(caption);

        button.addEventListener("click", () => {
          openProductModal(product);
        });

        return button;
      }

      function renderGrid(products) {
        productGrid.replaceChildren();

        if (products.length === 0) {
          productGrid.classList.add("hidden");
          emptyFilterState.classList.remove("hidden");
          productCount.textContent = `Showing 0 of ${allProducts.length} products`;
          return;
        }

        emptyFilterState.classList.add("hidden");
        productGrid.classList.remove("hidden");

        const fragment = document.createDocumentFragment();
        for (const product of products) {
          fragment.appendChild(createProductCard(product));
        }
        productGrid.appendChild(fragment);

        productCount.textContent =
          products.length === allProducts.length
            ? `${allProducts.length} products (sorted A–Z by 8-digit product code)`
            : `Showing ${products.length} of ${allProducts.length} products`;
      }

      // Filter handler
      filterInput.addEventListener("input", () => {
        const query = filterInput.value.trim().toLowerCase();

        if (!query) {
          renderGrid(allProducts);
          return;
        }

        const filtered = allProducts.filter(p =>
          p.ProductCode.toLowerCase().includes(query) ||
          p.ProductNameC.toLowerCase().includes(query) ||
          p.EAN13.toLowerCase().includes(query) ||
          p.ProductCodeLong.toLowerCase().includes(query)
        );

        renderGrid(filtered);
      });

      // Modal close listeners
      closeModalBtn.addEventListener("click", closeProductModal);
      modalBackdrop.addEventListener("click", closeProductModal);

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !productModal.classList.contains("hidden")) {
          closeProductModal();
        }
      });

      // Initialize catalog
      loadProducts()
        .then(products => {
          allProducts = products;
          loadingState.classList.add("hidden");
          renderGrid(allProducts);
        })
        .catch(error => {
          loadingState.classList.add("hidden");
          productCount.textContent = "Failed to load catalog";
          errorState.textContent =
            error instanceof TypeError
              ? "Unable to load products.csv. Check your connection or local server setup."
              : error.message;
          errorState.classList.remove("hidden");
        });
    });
  </script>
</body>
</html>
